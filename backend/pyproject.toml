[project]
name = "welfare-ai-backend"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.141.1",
    "uvicorn==0.53.0",
    "pydantic",
    "python-dotenv==1.2.3",
    "certifi",
    "pymongo==4.18.1",
    "groq==1.7.0",
    "numpy==2.5.3",
    "faiss-cpu==1.15.1",
    "sentence-transformers==6.1.0",
    "transformers==5.17.0",
    "torch==2.14.0+cpu",
]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
